<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤️️ Para Denny ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0005;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(to bottom, #500014, #200008);
        }

        /* Caja de poema estilo HUD de Geometry Dash */
        #poem-box {
            position: absolute;
            top: 35px;
            left: 5%;
            width: 90%;
            background: rgba(20, 0, 5, 0.85);
            color: #ffb3c1;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid #ff2a4b;
            box-shadow: 0 0 15px rgba(255, 42, 75, 0.4);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Capa de inicio / muerte */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 0, 5, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            backdrop-filter: blur(6px);
        }

        .icon-heart {
            font-size: 55px;
            margin-bottom: 25px;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff2a4b); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 20px #ff2a4b); }
        }

        button {
            background: linear-gradient(135deg, #ff2a4b, #900020);
            color: #ffffff;
            border: 2px solid #ff758c;
            padding: 16px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 42, 75, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Pantalla Final Estilo "LEVEL COMPLETE" Geometry Dash */
        #win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 0, 5, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            z-index: 10;
        }

        .gd-card {
            background: linear-gradient(180deg, #1f2d18 0%, #0d1609 100%);
            border: 4px solid #4ed12a;
            box-shadow: 0 0 25px rgba(78, 209, 42, 0.6);
            border-radius: 18px;
            padding: 25px 20px;
            width: 90%;
            max-width: 380px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gd-title {
            color: #55ff33;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(85, 255, 51, 0.8), 2px 2px #000;
            margin-bottom: 12px;
        }

        .stars-container {
            font-size: 28px;
            margin-bottom: 15px;
            animation: glowStars 1.5s infinite alternate;
        }

        @keyframes glowStars {
            from { filter: drop-shadow(0 0 2px #ffdd00); }
            to { filter: drop-shadow(0 0 10px #ffdd00); }
        }

        .gd-msg {
            color: #ffffff;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Lluvia de Corazones */
        .falling-heart {
            position: absolute;
            top: -40px;
            color: #ff2a4b;
            font-size: 24px;
            pointer-events: none;
            z-index: 20;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="poem-box">❤️</div>

        <!-- Pantalla de Inicio / Reintento -->
        <div id="ui-overlay">
            <div class="icon-heart">❤️</div>
            <button id="start-btn">Jugar</button>
        </div>

        <!-- Pantalla estilo LEVEL COMPLETE -->
        <div id="win-overlay">
            <div class="gd-card">
                <div class="gd-title">¡Te Amo Dennis!</div>
                <div class="stars-container">⭐ ⭐ ⭐</div>
                <div class="gd-msg">Espero te haya gustado esta pequeña aventura y disfrutado este corto poema ❤️</div>
                <button id="replay-btn">Reintentar</button>
            </div>
        </div>
    </div>

    <!-- Música alojada en GitHub -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://github.com/EndersonSivira/Flappy-Heart/raw/main/Amar%20Como%20T%C3%BA%20-%20Steven%20Universe%20(Letra).(M4A_128K).m4a" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const poemBox = document.getElementById('poem-box');
        const uiOverlay = document.getElementById('ui-overlay');
        const winOverlay = document.getElementById('win-overlay');
        const startBtn = document.getElementById('start-btn');
        const replayBtn = document.getElementById('replay-btn');
        const bgMusic = document.getElementById('bg-music');
        const gameContainer = document.getElementById('game-container');

        bgMusic.volume = 0.5;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const poemVerses = [
            "En el vasto cielo del destino...",
            "un pequeño corazón empezó a volar,",
            "esquivando cada frío obstáculo,",
            "solo para poderte encontrar.",
            "Cada latido da un salto fuerte,",
            "desafiando el viento y el dolor,",
            "porque al final de este camino...",
            "nos espera un infinito amor. ❤️"
        ];

        let gameState = 'START';
        let frameCount = 0;
        let poemIndex = 0;
        let heartInterval = null;

        // Propiedades del Corazón
        const heart = {
            x: 70,
            y: 0,
            size: 16,
            gravity: 0.35,
            lift: -7.5,
            velocity: 0,
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#ff2a4b';
                ctx.shadowColor = '#ff2a4b';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size, -this.size * 1.5, this.size / 3, 0, this.size * 1.3);
                ctx.bezierCurveTo(this.size * 1.5, this.size / 3, this.size, -this.size, 0, 0);
                ctx.fill();
                ctx.restore();
            },
            
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                if (this.y > canvas.height - 20) {
                    this.y = canvas.height - 20;
                    gameOver();
                }
                if (this.y < 10) {
                    this.y = 10;
                    this.velocity = 0;
                }
            },

            jump() {
                this.velocity = this.lift;
            }
        };

        // Objeto Meta / Portal
        let goal = {
            x: -100,
            y: 0,
            width: 40,
            height: 120,
            active: false
        };

        let pipes = [];
        const pipeWidth = 55;
        const pipeGap = 160;
        const pipeSpeed = 2.8;

        function createPipe() {
            const minHeight = 60;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - pipeGap,
                passed: false
            });
        }

        function drawPipes() {
            ctx.fillStyle = '#7a001e';
            ctx.strokeStyle = '#ff2a4b';
            ctx.lineWidth = 3;

            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });
        }

        function drawGoal() {
            if (!goal.active) return;

            goal.y = canvas.height / 2 - goal.height / 2;

            ctx.save();
            ctx.shadowColor = '#55ff33';
            ctx.shadowBlur = 20;
            
            // Dibujar línea/portal de meta de Geometry Dash
            ctx.fillStyle = '#55ff33';
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(goal.x, goal.y, goal.width, goal.height);
            ctx.restore();
        }

        function updatePipes() {
            // Mientras no se hayan superado todos los versos, seguir creando obstáculos
            if (frameCount % 110 === 0 && poemIndex < poemVerses.length - 1) {
                createPipe();
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= pipeSpeed;

                // Colisión con los bloques
                if (
                    heart.x + heart.size > pipe.x &&
                    heart.x - heart.size < pipe.x + pipeWidth &&
                    (heart.y - heart.size < pipe.top || heart.y + heart.size > canvas.height - pipe.bottom)
                ) {
                    gameOver();
                }

                // Avance del poema
                if (!pipe.passed && pipe.x + pipeWidth < heart.x) {
                    pipe.passed = true;
                    advancePoem();
                }

                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(index, 1);
                }
            });

            // Aparecer la META al terminar los versos y limpiar el mapa
            if (poemIndex === poemVerses.length - 1 && pipes.length === 0 && !goal.active) {
                goal.x = canvas.width + 50;
                goal.active = true;
            }

            // Mover portal hacia el jugador
            if (goal.active) {
                goal.x -= pipeSpeed;

                // Tocar el portal meta -> ¡VICTORIA!
                if (heart.x + heart.size >= goal.x) {
                    winGame();
                }
            }
        }

        function advancePoem() {
            if (poemIndex < poemVerses.length - 1) {
                poemIndex++;
                poemBox.textContent = poemVerses[poemIndex];
            }
        }

        function resetGame() {
            stopHeartRain();
            heart.y = canvas.height / 2;
            heart.velocity = 0;
            pipes = [];
            goal.active = false;
            poemIndex = 0;
            frameCount = 0;
            poemBox.textContent = poemVerses[0];
            poemBox.style.display = 'block';
        }

        function startGame() {
            resetGame();
            gameState = 'PLAYING';
            uiOverlay.style.display = 'none';
            winOverlay.style.display = 'none';
            bgMusic.play().catch(() => {});
            animate();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            bgMusic.pause();
            startBtn.textContent = "❤️";
            uiOverlay.style.display = 'flex';
        }

        function winGame() {
            gameState = 'WIN';
            poemBox.style.display = 'none';
            winOverlay.style.display = 'flex';
            startHeartRain();
        }

        function animate() {
            if (gameState !== 'PLAYING') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            frameCount++;
            
            updatePipes();
            drawPipes();
            drawGoal();

            heart.update();
            heart.draw();

            requestAnimationFrame(animate);
        }

        // Lluvia de Corazones
        function startHeartRain() {
            heartInterval = setInterval(() => {
                const heartElem = document.createElement('div');
                heartElem.classList.add('falling-heart');
                heartElem.innerHTML = ['❤️', '💖', '💕', '💗'][Math.floor(Math.random() * 4)];
                heartElem.style.left = Math.random() * 100 + 'vw';
                heartElem.style.fontSize = (Math.random() * 20 + 20) + 'px';
                
                const duration = Math.random() * 3 + 2;
                heartElem.style.animationDuration = duration + 's';
                
                gameContainer.appendChild(heartElem);

                setTimeout(() => {
                    heartElem.remove();
                }, duration * 1000);
            }, 200);
        }

        function stopHeartRain() {
            clearInterval(heartInterval);
            document.querySelectorAll('.falling-heart').forEach(h => h.remove());
        }

        function handleTouch(e) {
            if (e) e.preventDefault();
            if (gameState === 'PLAYING') {
                heart.jump();
            }
        }

        window.addEventListener('touchstart', handleTouch, { passive: false });
        window.addEventListener('mousedown', handleTouch);

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });
        startBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            startGame();
        });

        replayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });
        replayBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            startGame();
        });
    </script>
</body>
</html>
